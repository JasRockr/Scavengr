# Laboratorio de integración de Scavengr. Puertos no estándar a propósito (hallazgo C1).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - ./postgres.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scv"]
      interval: 5s
      retries: 20

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - ./mysql.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Scavengr_Lab_2026!"
    ports: ["14333:1433"]
    volumes:
      - ./mssql.sql:/lab/mssql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Scavengr_Lab_2026!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 20
